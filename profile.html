<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IGOwork">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>IGOwork - Profile</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface-2:#f0f0f2;--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--line:rgba(0,0,0,.07);--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.06);--ease:cubic-bezier(.4,0,.2,1)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--surface-2:#242426;--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.08);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
@media(prefers-color-scheme:dark){header{background:rgba(28,28,30,.72)}}
.nav{max-width:560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0071e3,#5856d6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.brand{font-size:17px;font-weight:600}
.acct{margin-left:auto;font-size:13px;text-align:right}
.acct a{color:var(--accent);text-decoration:none;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:44px 20px 80px}
.hero{text-align:center}
.photo{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#34c8ff,#0071e3);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:700;overflow:hidden;box-shadow:var(--shadow)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-size:26px;font-weight:700;letter-spacing:-.02em}
.role{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(0,113,227,.12);color:var(--accent);text-transform:capitalize}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{appearance:none;border:0;border-radius:980px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:transform .15s var(--ease),opacity .15s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:#ff3b30;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
#msg{min-height:20px;margin:14px 0 0;text-align:center;font-size:14px;font-weight:600}
.card{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 20px}
.line{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line span:first-child{color:var(--muted)}
.line span:last-child{text-align:right;overflow-wrap:anywhere}
.fine{margin:14px 6px 0;font-size:12.5px;color:var(--muted);text-align:center}
.links{display:flex;gap:20px;justify-content:center;margin-top:30px}
.links a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
</style>
</head>
<body>
<header><div class="nav"><a href="/app" style="display:flex;align-items:center;flex:none"><picture><source srcset="/brand/logo-wordmark-dark.png" media="(prefers-color-scheme: dark)"><img src="/brand/logo-wordmark.png" alt="IGOwork" style="height:30px;width:auto;display:block"></picture></a>
  <div class="acct"><a href="/app" id="home">Home</a></div>
</div></header>

<div class="wrap">
  <div class="hero">
    <div class="photo" id="photo"></div>
    <div class="name" id="name"></div>
    <span class="role" id="role"></span>
    <div class="actions">
      <button class="btn" id="choose">Choose photo</button>
      <button class="btn danger" id="remove" style="display:none">Remove photo</button>
    </div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <p id="msg"></p>
  </div>

  <div class="card" id="details"></div>
  <p class="fine" id="fine"></p>

  <div class="links">
    <a href="/app" id="main">Find artisans</a>
    <a href="/bookings" id="jobs">My jobs</a>
    <a href="#" id="logout">Log out</a>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var me = { name: '' };

function say(text, bad) {
  $('msg').textContent = text;
  $('msg').style.color = bad ? '#ff3b30' : 'inherit';
}
function initials(n) {
  return String(n).split(' ').filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
}
function naira(n) { return '\u20A6' + Number(n).toLocaleString('en-NG'); }
function line(label, value) {
  var row = document.createElement('div');
  row.className = 'line';
  var a = document.createElement('span');
  a.textContent = label;
  var b = document.createElement('span');
  b.textContent = value;
  row.appendChild(a);
  row.appendChild(b);
  return row;
}
function rating(avg, count) {
  return count ? '\u2605 ' + Number(avg).toFixed(1) + ' (' + count + ')' : 'No ratings yet';
}

function setPhoto(url) {
  var box = $('photo');
  box.textContent = '';
  if (url) {
    var img = document.createElement('img');
    img.alt = '';
    img.src = url;
    box.appendChild(img);
  } else {
    box.textContent = initials(me.name);
  }
  $('remove').style.display = url ? '' : 'none';
}

function render(j) {
  var a = j.account;
  me.name = a.full_name;
  $('name').textContent = a.full_name;
  $('role').textContent = a.role;
  setPhoto(j.photo_url);

  var box = $('details');
  box.textContent = '';
  box.appendChild(line('Email', a.email));
  box.appendChild(line('Phone', a.phone || 'Not added'));
  var d = j.details;
  if (a.role === 'artisan' && d) {
    var trade = String(d.trade_category || '');
    box.appendChild(line('Trade', trade.charAt(0).toUpperCase() + trade.slice(1)));
    box.appendChild(line('Experience', d.years_of_experience + ' years'));
    box.appendChild(line('Service fee', naira(d.service_fee)));
    box.appendChild(line('Rating', rating(d.average_rating, d.total_ratings)));
    box.appendChild(line('Jobs completed', String(d.total_jobs_completed)));
    $('home').href = '/dashboard';
    $('home').textContent = 'Dashboard';
    $('main').href = '/dashboard';
    $('main').textContent = 'Dashboard';
    $('jobs').style.display = 'none';
    $('fine').textContent = 'Clients see your photo on search results.';
  } else {
    if (d) box.appendChild(line('Rating', rating(d.average_rating, d.total_ratings)));
    $('fine').textContent = 'Artisans see your photo only after they accept your request.';
  }
}

// Shrinks a chosen photo to a 320 x 320 square JPEG. Drawing it onto a canvas
// also removes hidden details such as the location the photo was taken at.
function toSquareJpeg(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var size = 320;
      var side = Math.min(img.naturalWidth, img.naturalHeight);
      if (!side) { URL.revokeObjectURL(url); reject(new Error('empty')); return; }
      var sx = (img.naturalWidth - side) / 2;
      var sy = (img.naturalHeight - side) / 2;
      var canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        if (blob) { resolve(blob); } else { reject(new Error('encode')); }
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('read')); };
    img.src = url;
  });
}

$('choose').onclick = function () { $('file').click(); };

$('file').onchange = function () {
  var f = this.files && this.files[0];
  this.value = '';
  if (!f) return;
  if (f.size > 15 * 1024 * 1024) {
    say('That file is too big. Please choose a photo under 15 MB.', true);
    return;
  }
  $('choose').disabled = true;
  say('Uploading...', false);

  toSquareJpeg(f)
    .then(function (blob) {
      return fetch('/api/profile/photo', {
        method: 'PUT',
        headers: { 'Content-Type': 'image/jpeg' },
        body: blob
      });
    })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      $('choose').disabled = false;
      if (j.error) { say(j.error, true); return; }
      setPhoto(j.photo_url);
      say('Photo saved.', false);
    })
    .catch(function () {
      $('choose').disabled = false;
      say('Could not use that photo. Please try a different JPEG or PNG image.', true);
    });
};

$('remove').onclick = function () {
  fetch('/api/profile/photo', { method: 'DELETE' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) { say(j.error, true); return; }
      setPhoto(null);
      say('Photo removed.', false);
    })
    .catch(function () { say('Could not reach the server.', true); });
};

$('logout').onclick = function (e) {
  e.preventDefault();
  fetch('/api/logout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: '{}'
  }).then(function () { location.href = '/login'; });
};

fetch('/api/profile')
  .then(function (r) {
    if (r.status === 401) { location.href = '/login'; return null; }
    return r.json();
  })
  .then(function (j) {
    if (!j) return;
    if (j.error) { say(j.error, true); return; }
    render(j);
  })
  .catch(function () { say('Could not reach the server.', true); });
</script>
<script src="/notify.js"></script>
</body>
</html>
